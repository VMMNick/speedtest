version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Інструменти розробки — одним PR
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Лишаємось на LTS-лінійці Node; мажорні оновлення — свідомо, вручну
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Мажорна версія PostgreSQL потребує міграції даних (pg_upgrade/dump), а 18-й образ
      # ще й змінив шлях даних у volume — оновлюємо вручну
      - dependency-name: postgres
        update-types: [version-update:semver-major]
