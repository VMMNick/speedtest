name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новий push у ту саму гілку скасовує попередній прогін
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · Types · Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck (JSDoc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Upload build
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Браузер кешується за версією Playwright — не качаємо ~150 МБ на кожен прогін
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  server:
    name: Server · PostgreSQL · Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: speedtest
          POSTGRES_PASSWORD: speedtest
          POSTGRES_DB: speedtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U speedtest" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://speedtest:speedtest@localhost:5432/speedtest
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix server

      - name: Unit + integration tests (real PostgreSQL & Redis)
        run: npm run test:server

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E against the self-hosted server
        run: npm run test:e2e:server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}

      - name: E2E of the cloud build (as on Render)
        run: npm run test:e2e:cloud
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"db":"ok"'
          curl -fsS http://localhost:8080/ | grep -q '<title>'
          curl -fsS -X POST http://localhost:8080/api/results -H 'content-type: application/json' \
            -d '{"server":"self","download":100,"upload":50,"ping":10,"jitter":1,"loss":0,"grade":"A","score":95}'
          curl -fsS http://localhost:8080/api/results/stats | grep -q '"count":1'
          test "$(docker inspect -f '{{.Config.User}}' speedtest:latest)" = node

      - name: Build the cloud image (as Render does)
        run: docker build --build-arg BUILD_MODE=cloud -t speedtest:cloud .

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy → GitHub Pages
    needs: [quality, e2e, server, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Деплої не скасовуються посередині — лише ставляться в чергу
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build (base = /<repo>/)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  live:
    name: Live smoke (справжній Cloudflare)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run live tests
        run: npm run test:live
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Upload live report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: playwright-report-live/
          retention-days: 14
