name: DB backup

# Щоденний дамп PostgreSQL (Neon) у артефакти GitHub Actions.
# Потрібен секрет DATABASE_BACKUP_URL — ПРЯМИЙ рядок підключення Neon
# (без "-pooler" у хості): pg_dump через PgBouncer працює ненадійно.
on:
  schedule:
    - cron: '17 3 * * *' # щодня о 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -z "$DATABASE_BACKUP_URL" ]; then
            echo "::warning::DATABASE_BACKUP_URL не задано — бекап пропущено"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p backup
          file="backup/speedtest-$(date -u +%Y-%m-%dT%H%M).dump"
          # pg_dump не працює із сервером НОВІШОЇ мажорної версії (Neon — PG 18), а старіші
          # сервери підтримує, тож клієнт беремо з запасом. Формат custom — стиснутий,
          # відновлюється вибірково через pg_restore
          docker run --rm -e URL="$DATABASE_BACKUP_URL" postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-acl "$URL"' > "$file"
          # Перевірка, що архів читається і містить таблицю results
          docker run --rm -i postgres:18 pg_restore --list < "$file" | grep -q 'TABLE public results'
          ls -lh backup

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          name: db-backup-${{ github.run_number }}
          path: backup/*.dump
          retention-days: 30
          if-no-files-found: error
