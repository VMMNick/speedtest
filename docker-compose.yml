# Локальний запуск усього стеку:
#   docker compose up -d --build     → http://localhost:8080
#   docker compose logs -f app worker
#   docker compose down               (дані БД лишаються у volume pgdata18)
name: speedtest

services:
  app:
    build: .
    image: speedtest:latest
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://speedtest:${POSTGRES_PASSWORD:-speedtest}@db:5432/speedtest
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # true, якщо перед сервером стоїть reverse proxy (nginx, Traefik, Caddy)
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Порожньо — випадковий секрет на кожен запуск (див. .env.example)
      RESULTS_TOKEN_SECRET: ${RESULTS_TOKEN_SECRET:-}
      # Фонові задачі виконує окремий сервіс worker
      JOBS_INLINE: 'false'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Фонові задачі BullMQ: стан провайдерів кожні 10 хв, очищення старих результатів раз на добу.
  # Той самий образ, інша команда; можна масштабувати незалежно від API.
  worker:
    build: .
    image: speedtest:latest
    command: ['node', 'apps/server/src/worker.js']
    environment:
      DATABASE_URL: postgres://speedtest:${POSTGRES_PASSWORD:-speedtest}@db:5432/speedtest
      REDIS_URL: redis://redis:6379
      STATUS_CHECK_EVERY_MIN: ${STATUS_CHECK_EVERY_MIN:-10}
    # Без власного HTTP: здоровий, якщо воркер зареєстрований у черзі BullMQ і розклад створено
    healthcheck:
      test: ['CMD', 'node', 'apps/server/src/worker-health.js']
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: speedtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speedtest}
      POSTGRES_DB: speedtest
    volumes:
      # PostgreSQL 18+: том монтується в /var/lib/postgresql (дані — у підкаталозі версії)
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speedtest -d speedtest']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Rate limit, кеш аналітики, токени й черга BullMQ. Розклад задач відновлюється на старті,
    # тож зберігати на диск не потрібно. noeviction — вимога BullMQ (ключі черги не можна витісняти).
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata18:
